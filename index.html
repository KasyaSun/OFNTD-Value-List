<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLD FNTD OFFICIAL VALUE LIST</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            text-align: center;
        }

        /* Шапка сайта */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #0a0a0a;
            border-bottom: 2px solid #222;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        .site-title {
            font-size: 12px;
            color: #fff;
            letter-spacing: 1px;
        }

        /* Кнопки категории в хедере */
        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-links a {
            color: #ccc;
            text-decoration: none;
            font-size: 10px;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #ff0055;
        }

        /* Баннер на фоне */
        .hero-banner {
            width: 100%;
            height: 280px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), #000), 
                        url('https://images.rbxcdn.com/12345') center/cover no-repeat;
            border-bottom: 3px solid #8b0000;
        }

        /* Главный заголовок */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-shadow: 3px 3px #550000;
        }

        .sub-text {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* Сетка категорий (карточек) */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            justify-items: center;
        }

        .category-card {
            background-color: #050505;
            border: 2px solid #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            width: 100%;
            max-width: 250px;
        }

        .category-card:hover {
            transform: translateY(-5px);
            border-color: #ff0055;
        }

        .card-img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 12px;
            margin-top: 10px;
        }

        /* Отдельный блок для Tier List под сеткой */
        .tierlist-section {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .tierlist-card {
            background-color: #050505;
            border: 2px solid #ff0055;
            padding: 20px 30px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            width: 100%;
            max-width: 800px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            text-decoration: none;
            color: #fff;
        }

        .tierlist-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
            border-color: #ff3300;
        }

        .tierlist-icon {
            font-size: 32px;
        }

        .tierlist-text-container {
            text-align: left;
        }

        .tierlist-title {
            font-size: 16px;
            color: #ff0055;
            text-shadow: 2px 2px #550000;
            margin-bottom: 8px;
        }

        .tierlist-desc {
            font-size: 8px;
            color: #aaa;
            line-height: 1.4;
        }

        /* Цвета текста категорий */
        .nightmare { 
            color: #3d0480; 
            text-shadow: 0 0 8px #8b0000;
        }
        .secret { color: #f70303; }
        .items-color { color: #f5e508; }
        
        /* Новый шрифт в стиле Vengeance */
        .vengeance { 
            color: #ff3c00; 
            text-shadow: 0 0 10px #ff0000, 2px 2px 0px #550000;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="https://via.placeholder.com/32" alt="Logo" class="logo-img">
            <span class="site-title">OLD FNTD OFFICIAL VALUE LIST</span>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="nightmare.html">Nightmare</a></li>
                <li><a href="secret.html">Secret</a></li>
                <li><a href="#" style="color: #ff3c00;">Vengeance</a></li>
                <li><a href="items.html">Items</a></li>
                <li><a href="#" style="color: #ff0055;">Tier List</a></li>
            </ul>
        </nav>
    </header>

    <div class="hero-banner"></div>

    <div class="main-container">
        <h1>OLD FNTD OFFICIAL VALUE LIST</h1>
        <p class="sub-text">Interact with the below buttons to see unit/item values!</p>

        <!-- Карточки категорий -->
        <div class="category-grid">
            <div class="category-card" onclick="filterCategory('nightmare.html')">
                <img src="https://videotourl.com/images/1787655696994-b6efe908-2736-4164-b08f-7803bae4924c.png" alt="Nightmare" class="card-img">
                <div class="card-title nightmare">Nightmare</div>
            </div>

            <div class="category-card" onclick="filterCategory('secret.html')">
                <img src="https://videotourl.com/images/1787655390281-d856ca9c-4c72-4845-8c85-0a7b549bb007.png" alt="Secret" class="card-img">
                <div class="card-title secret">Secret</div>
            </div>

            <div class="category-card" onclick="filterCategory('#')">
                <img src="https://cdn.corenexis.com/f/VFiLOhCwVvg.png" alt="Vengeance" class="card-img">
                <div class="card-title vengeance">Vengeance</div>
            </div>

            <div class="category-card" onclick="filterCategory('items.html')">
                <img src="https://cdn.corenexis.com/f/pXd8YrVrGHl.png" alt="Items" class="card-img">
                <div class="card-title items-color">Items</div>
            </div>
        </div>

        <!-- Нижний блок Tier List -->
        <div class="tierlist-section">
            <div class="tierlist-card" onclick="filterCategory('#')">
                <div class="tierlist-icon">🏆</div>
                <div class="tierlist-text-container">
                    <div class="tierlist-title">TIER LIST</div>
                    <div class="tierlist-desc">Tier List SOON.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function filterCategory(pageUrl) {
            window.location.href = pageUrl;
        }
    </script>
</body>
</html>
